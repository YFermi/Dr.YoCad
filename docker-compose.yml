services:
  postgres:
    image: postgres:16-alpine
    container_name: cadline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadline
      POSTGRES_PASSWORD: cadline_dev_password
      POSTGRES_DB: cadline
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cadline -d cadline']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: cadline-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s

  # S3-compatible object storage. MinIO's community images/binaries are no longer
  # distributed (the pinned minio/minio tag 404s on Docker Hub), so dev/CI use
  # SeaweedFS's S3 gateway. Credentials: infra/seaweedfs/s3.json (dev only).
  s3:
    image: chrislusf/seaweedfs:4.55
    container_name: cadline-s3
    restart: unless-stopped
    command: >
      server -dir=/data -ip.bind=0.0.0.0
      -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - '9000:9000'
    volumes:
      - s3_data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  postgres_data:
  redis_data:
  s3_data:
